[package]
name = "nrz-gamepanel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "nrzGamePanel – Backend (Axum): Prozesse, Konsole, Dateien, Import, Minecraft, Factorio, MCP"

[dependencies]
nrz-gp-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sysinfo = "0.37"
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
mime_guess = "2"
walkdir = "2"
nix = { version = "0.30", features = ["signal", "process"] }

# Archive
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
lzma-rs = "0.3"

# Minecraft
fastnbt = "2"
fastanvil = { version = "0.32", default-features = false, features = ["render"] }
image = { version = "0.25", default-features = false, features = ["png"] }
toml = "0.8"
serde_yaml = "0.9"
